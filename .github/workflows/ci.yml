name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.4
          # 只装测试需要的轻量依赖，避免在 CI 下载大模型/重依赖
          pip install numpy jieba

      - name: 跑单元测试（跳过需 LLM 的集成测试）
        env:
          HF_ENDPOINT: https://hf-mirror.com
        run: |
          pytest -v -m "not integration" --tb=short
